# LiteLLM proxy configuration for the Responsible AI Enterprise Gateway.
#
# The proxy is the only component that holds provider credentials. The FastAPI
# AI Gateway talks to it over the OpenAI-compatible API with a LiteLLM virtual
# key (or the master key in local development) and never sees GROQ_API_KEY.
#
# Local:  docker compose up -d        (mounts this file into the litellm container)
# AWS:    infra/modules/ecs-litellm-proxy uploads this file to S3 and the task
#         loads it via LITELLM_CONFIG_BUCKET_NAME / LITELLM_CONFIG_BUCKET_OBJECT_KEY.
#
# Reference: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # --- Chat models exposed to the gateway. Only models the Groq account actually
  #     serves are listed; llama-3.x are not available on this account. ---
  - model_name: openai/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
    model_info:
      description: Default chat model (OpenAI GPT-OSS 120B on Groq)

  - model_name: openai/gpt-oss-20b
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
    model_info:
      description: Fast, low-cost model for judges and fallbacks (GPT-OSS 20B on Groq)

  # --- Model groups. The app can target a *capability* instead of a vendor model,
  #     which is what lets FinOps/AIOps re-route without an application deploy. ---
  - model_name: chat-default
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: judge-fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      # Judges return a short verdict; low reasoning effort cuts hidden
      # reasoning tokens (and cost) without changing the chat model.
      reasoning_effort: low

  # Add further providers here without touching application code, e.g.
  # - model_name: llama-3.3-70b-versatile
  #   litellm_params:
  #     model: groq/llama-3.3-70b-versatile      # enable if the Groq account serves it
  #     api_key: os.environ/GROQ_API_KEY
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: claude-3-5-haiku
  #   litellm_params:
  #     model: bedrock/anthropic.claude-3-5-haiku-20241022-v1:0
  #     aws_region_name: ap-southeast-1

router_settings:
  # Retries happen in the proxy, once, with jitter; the application does not
  # retry so a provider incident does not multiply load.
  num_retries: 2
  timeout: 30
  allowed_fails: 3
  cooldown_time: 30
  routing_strategy: simple-shuffle
  # Degrade to the small model when the large one is unavailable rather than
  # failing the chat. The AI Gateway records fallbacks from the response header
  # (x-litellm-attempted-fallbacks) so the AIOps dashboard shows when this fires.
  fallbacks:
    - openai/gpt-oss-120b: [openai/gpt-oss-20b]
    - chat-default: [judge-fast]

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 30
  # Return cost / model / retry metadata in response headers; the AI Gateway
  # reads these for metering.
  return_response_headers: true
  # Trace every proxied call into the same Jaeger/OTel collector the gateway
  # uses, with W3C traceparent propagation from the gateway.
  callbacks: ["otel"]
  # Enable when Langfuse keys are present in the proxy environment. Prefer
  # emitting Langfuse traces from the proxy rather than the application, so
  # there is exactly one generation record per model call.
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Postgres is required for virtual keys, team budgets and the spend log.
  # Without it the proxy still works (master key only, cost still returned in
  # headers) but keys and spend are not persisted.
  database_url: os.environ/DATABASE_URL
  # Models added from the admin catalogue (/model/new) are stored in Postgres and
  # merged with this file on start-up. Requires LITELLM_SALT_KEY to encrypt stored
  # credentials; keep that key stable for the life of the database.
  store_model_in_db: true
  # Protect the proxy's management routes; the gateway only needs the
  # OpenAI-compatible routes.
  allow_requests_on_db_unavailable: true
