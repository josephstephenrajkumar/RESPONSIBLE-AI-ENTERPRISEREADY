# Offline / zero-spend LiteLLM configuration.
#
# Routes every model the application knows about to tests/mock_llm_upstream.py
# instead of a real provider, with explicit per-token prices so the proxy still
# emits x-litellm-response-cost and the FinOps dashboard has real numbers.
#
#   backend/venv/bin/python tests/mock_llm_upstream.py --port 4010
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d litellm
#
# Prices mirror pricing.py for the models they stand in for, so "estimated"
# and "litellm" costs agree in this mode.

model_list:
  - model_name: llama-3.3-70b-versatile
    litellm_params:
      model: openai/mock-chat
      api_base: os.environ/MOCK_UPSTREAM_URL
      api_key: mock
    model_info:
      input_cost_per_token: 0.00000059
      output_cost_per_token: 0.00000079

  - model_name: llama-3.1-8b-instant
    litellm_params:
      model: openai/mock-judge
      api_base: os.environ/MOCK_UPSTREAM_URL
      api_key: mock
    model_info:
      input_cost_per_token: 0.00000005
      output_cost_per_token: 0.00000008

  - model_name: openai/gpt-oss-120b
    litellm_params:
      model: openai/mock-chat
      api_base: os.environ/MOCK_UPSTREAM_URL
      api_key: mock
    model_info:
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.00000060

  - model_name: openai/gpt-oss-20b
    litellm_params:
      model: openai/mock-judge
      api_base: os.environ/MOCK_UPSTREAM_URL
      api_key: mock
    model_info:
      input_cost_per_token: 0.000000075
      output_cost_per_token: 0.00000030

  - model_name: chat-default
    litellm_params:
      model: openai/mock-chat
      api_base: os.environ/MOCK_UPSTREAM_URL
      api_key: mock
    model_info:
      input_cost_per_token: 0.00000059
      output_cost_per_token: 0.00000079

  - model_name: judge-fast
    litellm_params:
      model: openai/mock-judge
      api_base: os.environ/MOCK_UPSTREAM_URL
      api_key: mock
    model_info:
      input_cost_per_token: 0.00000005
      output_cost_per_token: 0.00000008

  # Chaos models for AIOps verification.
  - model_name: mock-fail
    litellm_params:
      model: openai/mock-fail
      api_base: os.environ/MOCK_UPSTREAM_URL
      api_key: mock

  - model_name: mock-slow
    litellm_params:
      model: openai/mock-slow
      api_base: os.environ/MOCK_UPSTREAM_URL
      api_key: mock
    model_info:
      input_cost_per_token: 0.00000059
      output_cost_per_token: 0.00000079

# router_settings (retries, timeout, cooldown, fallbacks) are NOT pinned here on
# purpose: LiteLLM refuses runtime changes to keys set in this file. They are seeded
# from litellm/runtime_defaults.json by the gateway and managed in the Proxy Manager.

litellm_settings:
  # Pinned (platform-owned): metering headers and the OpenTelemetry callback.
  # drop_params / request_timeout / success_callback / cache live in the proxy
  # database (runtime_defaults.json + Proxy Manager) so administrators can change them.
  set_verbose: false
  return_response_headers: true
  callbacks: ["otel"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Models added from the admin catalogue (/model/new) are stored in Postgres and
  # merged with this file on start-up. Requires LITELLM_SALT_KEY to encrypt stored
  # credentials; keep that key stable for the life of the database.
  store_model_in_db: true
  allow_requests_on_db_unavailable: true
